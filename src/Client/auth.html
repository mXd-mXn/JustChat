<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustChat — Вхід</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <h1>JustChat</h1>
    </header>

    <section class="card">
      <div class="tabs">
        <button type="button" id="tab-login" class="tab active">Вхід</button>
        <button type="button" id="tab-register" class="tab">Реєстрація</button>
      </div>

      <!-- Форма входу -->
      <form id="login-form">
        <label>
          Нікнейм
          <input type="text" id="login-username" placeholder="Введи свій нікнейм" required />
        </label>
        <label>
          Пароль
          <input type="password" id="login-password" placeholder="Введи пароль" required />
        </label>
        <button type="submit">Увійти</button>
      </form>

      <!-- Форма реєстрації -->
      <form id="register-form" class="hidden">
        <label>
          Нікнейм
          <input type="text" id="reg-username" placeholder="Нікнейм " required />
        </label>
        <label>
          Електронна пошта (@proton.me)
          <input type="email" id="reg-email" placeholder="name@proton.me" required />
        </label>
        <label>
          Пароль
          <input type="password" id="reg-password" placeholder="Придумай пароль" required />
        </label>
        <button type="submit">Зареєструватися</button>
      </form>

      <p id="auth-error" class="error"></p>
    </section>
  </div>

  <script src="/auth.js"></script>
</body>
</html>
